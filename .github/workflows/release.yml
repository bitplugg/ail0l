name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история нужна для генерации changelog между тегами.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (platform, NDK, CMake)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              android-sdk-platform-tools-common
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            cat > keystore.properties <<EOF
            storeFile=keystore.jks
            storePassword=$KEYSTORE_PASSWORD
            keyAlias=$KEY_ALIAS
            keyPassword=$KEY_PASSWORD
            EOF
            echo "Signing keystore applied."
          else
            echo "No keystore secrets: release will be signed with the debug key."
          fi

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Generate changelog
        run: |
          PREV="$(git describe --abbrev=0 --tags "$(git rev-list --tags --max-count=1 --skip=1)" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            git log --oneline --no-decorate "$PREV..HEAD" > CHANGELOG.md
          else
            git log --oneline --no-decorate > CHANGELOG.md
          fi
          if [ ! -s CHANGELOG.md ]; then
            echo "(В этом релизе нет изменений.)" > CHANGELOG.md
          fi
          echo "=== CHANGELOG.md ==="
          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AIL0L ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          files: |
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false