name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (например, v0.0.5)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Use vMAJOR.MINOR.PATCH, for example v0.0.5"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from ${GITHUB_SHA::12}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (platform, NDK, CMake)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMGR" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Signing keystore applied."
          else
            echo "No keystore secrets: release will be signed with the debug key."
          fi

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify and checksum APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          chmod +x scripts/verify-apk.sh
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk scripts/verify-apk.sh "$APK" | tee /tmp/aiia-apk-verification.txt
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          cat "$APK.sha256"

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ steps.release.outputs.tag }}"
          PREV="$(git tag --list 'v*' --sort=-version:refname | grep -v -Fx "$CURRENT_TAG" | head -n 1 || true)"
          if [ -n "$PREV" ]; then
            git log --oneline --no-decorate "$PREV..HEAD" > CHANGELOG.md
          else
            git log --oneline --no-decorate > CHANGELOG.md
          fi
          if [ ! -s CHANGELOG.md ]; then
            echo "(В этом релизе нет изменений.)" > CHANGELOG.md
          fi
          echo "=== CHANGELOG.md ==="
          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "AIIA ${{ steps.release.outputs.tag }}"
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
